<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web & Software Development – Şəki, Azerbaijan</title>
<meta name="description" content="Websites, games, apps and automation built to order. Based in Şəki, Azerbaijan, working worldwide. / Sayt, oyun, proqram və avtomatlaşdırma. Şəki, Azərbaycan.">
<style>
  :root{--bg:#0b0e1a;--card:#141a30;--line:#ffffff14;--text:#e8ebf8;--mut:#9aa3c4;--a:#22d3ee;--b:#a78bfa}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.6}
  .w{max-width:1050px;margin:0 auto;padding:0 20px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
  nav b{font-size:18px}
  .lang button{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;cursor:pointer;font-weight:600}
  .lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}
  .lang button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#06121a;border-color:transparent}
  .hero{padding:70px 0 50px}
  .hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:0 0 16px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}
  .hero p{font-size:19px;color:var(--mut);max-width:620px}
  .btn{display:inline-block;margin:14px 10px 0 0;padding:13px 26px;border-radius:12px;font-weight:600;text-decoration:none;color:#06121a;background:linear-gradient(90deg,var(--a),var(--b))}
  .btn.o{background:none;color:var(--text);border:1px solid var(--line)}
  h2{font-size:30px;margin:60px 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card h3{margin:0 0 6px}.card p{margin:0;color:var(--mut);font-size:14px}
  .proj{display:block;color:inherit;text-decoration:none;overflow:hidden;padding:0;transition:.2s}
  .proj:hover{transform:translateY(-4px);border-color:var(--a)}
  .proj img{width:100%;height:170px;object-fit:cover;object-position:top;display:block;background:#0003}
  .proj div{padding:16px 20px 20px}
  .tag{font-size:12px;color:var(--a)}
  #contact{text-align:center;padding:30px 0 50px}
  #contact .card{padding:34px}
  #contact a.big{display:block;font-size:26px;font-weight:700;color:var(--a);text-decoration:none;margin-top:8px}
  footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}
</style>
</head>
<body>
<div class="w">
  <nav><b>{ }&nbsp;<span id="brand"></span></b><div class="lang"><button data-l="az" class="on">AZ</button><button data-l="en">EN</button></div></nav>

  <section class="hero">
    <h1 data-k="h1"></h1>
    <p data-k="sub"></p>
    <a class="btn" href="#contact" data-k="cta"></a><a class="btn o" href="#work" data-k="cta2"></a>
  </section>

  <h2 data-k="svcT"></h2>
  <div class="grid" id="svc"></div>

  <h2 id="work" data-k="workT"></h2>
  <div class="grid" id="work-grid"></div>

  <h2 data-k="whyT"></h2>
  <div class="grid" id="why"></div>

  <section id="contact">
    <h2 data-k="conT"></h2>
    <div class="card">
      <p data-k="conP"></p>
      <a class="big" id="phone" href="#"></a>
      <p style="margin-top:14px" data-k="loc"></p>
    </div>
  </section>
  <footer data-k="foot"></footer>
</div>
<script>
/* ===== EDIT THESE ===== */
const CONFIG={brand:'Punu Web',phone:'+994 50 434 12 85',phoneHref:'+994504341285'};
/* ====================== */
const T={
az:{
 h1:'Sayt, oyun və proqramlar — sifarişlə, tez və keyfiyyətlə.',
 sub:'Şəkidən çalışıram, dünyanın istənilən yerindən sifarişləri qəbul edirəm. İdeyanızı işlək məhsula çevirirəm.',
 cta:'Əlaqə saxla',cta2:'İşlərimə bax',
 svcT:'Xidmətlər',workT:'Nümunə layihələr',whyT:'Niyə mənimlə?',conT:'Gəlin danışaq',
 conP:'Layihənizi qısaca yazın və ya zəng edin — pulsuz məsləhət verirəm.',loc:'📍 Şəki, Azərbaycan · Uzaqdan bütün dünya üzrə',
 svc:[['Veb-saytlar','Landing, korporativ sayt, onlayn mağaza — mobilə uyğun və sürətli.'],['Oyunlar','Brauzer üçün mini oyunlar və interaktiv layihələr.'],['Proqramlar və botlar','Telegram botlar, masaüstü və veb proqramlar.'],['Avtomatlaşdırma','Təkrarlanan işlərin avtomatlaşdırılması: hesabat, cədvəl, bildiriş.']],
 why:[['Sürətli təhvil','Kiçik layihələr günlər içində hazır olur.'],['Aydın ünsiyyət','Hər mərhələdə nəticəni görürsünüz.'],['Davamlı dəstək','Təhvildən sonra düzəliş və dəstək.']],
 foot:'Nümunə layihələr nümayiş məqsədilə hazırlanıb (uydurma markalar).'},
en:{
 h1:'Websites, games and software — built to order, fast and clean.',
 sub:'Based in Şəki, Azerbaijan, working with clients worldwide. I turn your idea into a working product.',
 cta:'Get in touch',cta2:'See my work',
 svcT:'Services',workT:'Sample projects',whyT:'Why work with me',conT:"Let's talk",
 conP:'Describe your project in a few lines or give me a call — free consultation.',loc:'📍 Şəki, Azerbaijan · Remote worldwide',
 svc:[['Websites','Landing pages, business sites, online shops — responsive and fast.'],['Games','Browser mini-games and interactive projects.'],['Apps & bots','Telegram bots, desktop and web applications.'],['Automation','Automate repetitive work: reports, spreadsheets, notifications.']],
 why:[['Fast delivery','Small projects ready in days.'],['Clear communication','You see progress at every step.'],['Ongoing support','Fixes and support after delivery.']],
 foot:'Sample projects are demos built for showcase purposes (fictional brands).'}
};
const WORK=[
 ['projects/landing/','shots/landing.png',{az:['Brewline — Landing səhifə','Veb-sayt'],en:['Brewline — Landing page','Website']}],
 ['projects/snake/','shots/snake.png',{az:['Neon Snake — Oyun','Oyun'],en:['Neon Snake — Game','Game']}],
 ['projects/messenger/','shots/messenger.png',{az:['Chatly — Mesajlaşma interfeysi','Proqram'],en:['Chatly — Messenger UI','App']}],
 ['projects/dashboard/','shots/dashboard.png',{az:['AutoFlow — Avtomatlaşdırma paneli','Avtomatlaşdırma'],en:['AutoFlow — Automation dashboard','Automation']}]
];
const $=s=>document.querySelector(s);
function set(l){
  document.documentElement.lang=l;const t=T[l];
  document.querySelectorAll('[data-k]').forEach(e=>e.textContent=t[e.dataset.k]);
  const card=a=>a.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');
  $('#svc').innerHTML=card(t.svc);$('#why').innerHTML=card(t.why);
  $('#work-grid').innerHTML=WORK.map(w=>`<a class="card proj" href="${w[0]}"><img src="${w[1]}" alt="${w[2][l][0]}" loading="lazy"><div><span class="tag">${w[2][l][1]}</span><h3>${w[2][l][0]}</h3></div></a>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
$('#brand').textContent=CONFIG.brand;$('#phone').textContent=CONFIG.phone;$('#phone').href='tel:'+CONFIG.phoneHref;
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>set(b.dataset.l));
let init='az';try{init=localStorage.getItem('lang')||'az'}catch(e){}
set(init);
</script>
</body>
</html>
