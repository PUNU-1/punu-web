<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Snake</title>
<style>
  :root{--bg:#0b0d17;--card:#141828;--accent:#22d3ee;--accent2:#a78bfa;--text:#e6e9f5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1a1f3a,var(--bg));font-family:system-ui,sans-serif;color:var(--text)}
  .wrap{background:var(--card);padding:24px;border-radius:20px;box-shadow:0 20px 60px #0008,0 0 0 1px #ffffff12;text-align:center}
  h1{margin:0 0 4px;font-size:28px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
  .bar{display:flex;justify-content:space-between;margin:10px 4px;font-size:14px;opacity:.85}
  canvas{background:#0d1020;border-radius:12px;display:block;box-shadow:inset 0 0 0 1px #ffffff12}
  button{margin-top:14px;padding:10px 22px;border:0;border-radius:10px;font-weight:600;cursor:pointer;color:#06121a;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  small{display:block;margin-top:10px;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Neon Snake</h1>
  <div class="bar"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <button id="btn">Start / Restart</button>
  <small>Arrow keys or WASD · swipe on mobile</small>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=c.width/N;
let snake,dir,next,food,score,best=+(localStorage.getItem('snakeBest')||0),timer,alive=false;
document.getElementById('best').textContent=best;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;place();document.getElementById('score').textContent=0}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function draw(){
  x.fillStyle='#0d1020';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#ffffff08';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}
  x.shadowBlur=14;x.shadowColor='#f472b6';x.fillStyle='#f472b6';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);x.fill();
  snake.forEach((s,i)=>{x.shadowColor=i?'#22d3ee':'#a78bfa';x.fillStyle=i?'#22d3ee':'#a78bfa';x.beginPath();x.roundRect(s.x*S+2,s.y*S+2,S-4,S-4,5);x.fill()});
  x.shadowBlur=0;
}
function tick(){
  dir=next;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  if(snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;clearInterval(timer);x.fillStyle='#000a';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Game over',c.width/2,c.height/2);return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('best').textContent=best}place()}else snake.pop();
  draw();
}
function start(){clearInterval(timer);reset();alive=true;draw();timer=setInterval(tick,110)}
function turn(nx,ny){if(nx===-dir.x&&ny===-dir.y)return;next={x:nx,y:ny}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')turn(0,-1);else if(k==='arrowdown'||k==='s')turn(0,1);else if(k==='arrowleft'||k==='a')turn(-1,0);else if(k==='arrowright'||k==='d')turn(1,0);
  if(k.startsWith('arrow'))e.preventDefault()});
let t0;c.addEventListener('touchstart',e=>{t0=e.touches[0]});
c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
document.getElementById('btn').onclick=start;
reset();draw();
</script>
</body>
</html>
